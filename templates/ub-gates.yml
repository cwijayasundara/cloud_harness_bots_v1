# Uncle Bob's computed gates as a PR check. Copy to .github/workflows/ub-gates.yml (chb install --ci does it).
#
# What protects it:
# - The gate code (.rig/ub) and .rig/ub-baseline.json come from the BASE branch, so a PR's edits to them are ignored.
# - Each gate runs in its own job on a fresh runner. crapper and mutator run the PR's tests, and that code could
#   rewrite files on its runner, so it never shares a runner with another gate's verdict.
# - The tools are pinned to commits you have read; actions are pinned by SHA.
# - On pull_request this file itself comes from the PR. Protect it with CODEOWNERS plus "Require review from Code
#   Owners", or a PR can edit the workflow that judges it.
# Make the single job "ub-gates" a required check (the per-gate jobs feed it). chb merge requires it by default.
name: ub-gates
on: pull_request
permissions:
  contents: read
concurrency:
  group: ub-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  # crapper, dryer and mutator at the commits chb was verified against on 26 Oct 2026; move them after reading the diff.
  UB_PINS: crapper=6fd92c4c9bcc56efb64a2f8743d5a2993bcfd42d,dryer=66ff6d21a42c04afcad89c78a80066176d1294b0,mutator=a5a0cb803b66e0cdb8bf471b3b08af701d424a41
jobs:
  gate:
    name: ub ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gate: [dry, crap, mutate]
    # Mutation stays advisory until the rollout's week 4: delete this line then.
    continue-on-error: ${{ matrix.gate == 'mutate' }}
    env:
      CHB_BASE: origin/${{ github.base_ref }}
      UB_TOOLS_DIR: ${{ runner.temp }}/ub-tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Gate code and baseline from the base branch
        run: |
          if git cat-file -e "$CHB_BASE:.rig/ub/bin/chb.ts" 2>/dev/null; then
            rm -rf .rig/ub && git checkout "$CHB_BASE" -- .rig/ub
            if git cat-file -e "$CHB_BASE:.rig/ub-baseline.json" 2>/dev/null; then git checkout "$CHB_BASE" -- .rig/ub-baseline.json; else rm -f .rig/ub-baseline.json; fi
          else
            echo "::notice::bootstrap: no chb on the base branch yet; using this PR's copy. This PR needs human review."
          fi
      - name: Install crapper, dryer and mutator (pinned)
        run: node --disable-warning=ExperimentalWarning .rig/ub/bin/chb.ts tools install --pin "$UB_PINS"
      # Toolchain: crapper and mutator run your tests. Uncomment what your repo needs (dry needs none of it).
      # - if: matrix.gate != 'dry'
      #   run: npm ci
      # - if: matrix.gate != 'dry'
      #   run: pip install -e '.[dev]'
      - name: Gate
        run: node --disable-warning=ExperimentalWarning .rig/ub/bin/chb.ts gate ${{ matrix.gate }}
      - name: Result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ub-${{ matrix.gate }}
          path: .rig/ub/results/
          if-no-files-found: ignore
  ub-gates:
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required gate passed
        env:
          RESULT: ${{ needs.gate.result }}
        run: |
          echo "gates: $RESULT"
          test "$RESULT" = success
